name: Quality

on:
  push:
    branches: [main, cursor/**]
  pull_request:

jobs:
  compose-and-phpcs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose file
        run: docker compose -f docker-compose.yml --env-file .env.example config --quiet

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: PHPCS
        run: composer phpcs

      - name: PHP lint
        run: composer lint
